services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./models:/app/models", "./reports:/app/reports"]
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./models:/app/models", "./reports:/app/reports"]
